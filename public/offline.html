<!doctype html>
<html lang="en-KE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline | Mikono Creations</title>
<style>
  :root { --bone:#F3EEE5; --paper:#FBF8F2; --ink:#2A2420; --stone:#5F5348; --action:#8A4630; --bot:#7C3F2B; --top:#A4583D; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); background: var(--bone); color: var(--ink); font: 400 1.0625rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(440px, 100%); padding: 28px 24px; border-radius: 30px; text-align: center; background: linear-gradient(175deg, var(--paper), #EBE2D3);
    box-shadow: inset 0 2px 3px rgba(255,255,255,.85), inset 0 -10px 16px rgba(110,75,50,.1), 0 1px 2px rgba(59,42,34,.1), 0 10px 18px -6px rgba(59,42,34,.16), 0 30px 44px -18px rgba(59,42,34,.22); }
  img { width: 64px; height: auto; }
  h1 { margin: 12px 0 8px; font-size: 1.5rem; line-height: 1.15; letter-spacing: -.02em; }
  p { margin: 0 0 8px; color: var(--stone); }
  .row { display: grid; gap: 10px; margin-top: 18px; }
  a, button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; font: 600 1rem/1 system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  button { color: #FFF8EE; background: linear-gradient(180deg, var(--top), var(--bot)); box-shadow: inset 0 2px 2px rgba(255,255,255,.35), inset 0 -4px 6px rgba(60,20,10,.35), 0 10px 16px -6px rgba(120,60,35,.5); }
  a { color: var(--ink); background: linear-gradient(180deg, #FFFDF8, #EEE5D6); box-shadow: 0 8px 14px -6px rgba(59,42,34,.2); }
  :focus-visible { outline: 3px solid var(--action); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/logo-mark.png" alt="" width="64" height="66">
  <h1>You are offline</h1>
  <p>Mikono Creations needs a connection to show this page. Pages you have already opened will load again when you are back online.</p>
  <div class="row">
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="tel:+254724592115">Call +254 724 592 115</a>
  </div>
</main>
</body>
</html>
